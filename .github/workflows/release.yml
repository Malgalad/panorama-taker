name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-2022
    env:
      RELEASE_VERSION: ${{ github.ref_name }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Verify release version
        shell: pwsh
        run: |
          $expected = $env:RELEASE_VERSION.TrimStart("v")
          $actual = (Select-String -Path stitcher/pyproject.toml -Pattern '^version = "(.+)"$').Matches.Groups[1].Value
          if ($actual -ne $expected) {
            throw "Tag $env:RELEASE_VERSION does not match stitcher version $actual"
          }
      - name: Install stitcher and checks
        shell: pwsh
        run: python -m pip install -e ".\stitcher[dev]"
      - name: Run stitcher checks
        shell: pwsh
        run: |
          ruff check stitcher/src stitcher/scripts stitcher/tests
          mypy stitcher/src
          pytest -q stitcher/tests
      - name: Build ReShade add-on
        shell: pwsh
        run: |
          cmake -S reshade-addon -B build/reshade-addon -G "Visual Studio 17 2022" -A x64
          cmake --build build/reshade-addon --config Release
      - name: Build release archives
        shell: pwsh
        run: |
          $version = $env:RELEASE_VERSION.TrimStart("v")
          .\release\build-windows-release.ps1 `
            -AddonPath .\build\reshade-addon\Release\PanoramaCaptureReShade.addon64 `
            -Version $version `
            -PythonCommand python
      - name: Verify archive contents and generate checksums
        shell: pwsh
        run: |
          $version = $env:RELEASE_VERSION.TrimStart("v")
          $verify = Join-Path $env:RUNNER_TEMP "panorama-release-verify"
          Expand-Archive "dist\PanoramaCapture-Mod-$version.zip" (Join-Path $verify "mod")
          Expand-Archive "dist\PanoramaCapture-Stitcher-$version-win-x64.zip" (Join-Path $verify "stitcher")
          $cet = Join-Path $verify "mod\bin\x64\plugins\cyber_engine_tweaks\mods\PanoramaCaptureProbe\init.lua"
          $addon = Join-Path $verify "mod\bin\x64\PanoramaCaptureReShade.addon64"
          $stitcher = Join-Path $verify "stitcher\PanoramaCaptureStitcher\PanoramaCaptureStitcher.exe"
          if (-not (Test-Path $cet) -or -not (Test-Path $addon) -or -not (Test-Path $stitcher)) {
            throw "Release archive content validation failed"
          }
          Get-ChildItem dist -File -Filter "*.zip" | ForEach-Object {
            $hash = (Get-FileHash $_ -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$($_.Name)"
          } | Set-Content dist\SHA256SUMS.txt
      - name: Write build provenance
        shell: pwsh
        run: |
          @(
            "tag=$env:RELEASE_VERSION"
            "commit=$env:GITHUB_SHA"
            "runner_os=$env:RUNNER_OS"
            "runner_image=$env:ImageOS"
            ""
            "pip_freeze:"
          ) | Set-Content dist\BUILD-INFO.txt
          & .\.venv-release\Scripts\python.exe -m pip freeze | Add-Content dist\BUILD-INFO.txt
      - name: Publish GitHub Release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            (Get-ChildItem dist -File -Filter "*.zip").FullName
            (Resolve-Path dist\SHA256SUMS.txt).Path
            (Resolve-Path dist\BUILD-INFO.txt).Path
          )
          & gh release create $env:RELEASE_VERSION $assets `
            --verify-tag `
            --generate-notes `
            --title "Panorama Capture $env:RELEASE_VERSION"
