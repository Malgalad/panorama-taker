name: Release

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"
  workflow_dispatch:
    inputs:
      release_version:
        description: "Version to package; must match stitcher/native/VERSION (without v)"
        required: true
        type: string
        default: "1.0.4"
      publish:
        description: "Publish archives to the matching GitHub Release"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-2022
    env:
      RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.release_version || github.ref_name }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_version || github.ref }}
      - name: Verify release version
        shell: pwsh
        run: |
          $expected = $env:RELEASE_VERSION.TrimStart("v")
          $actual = (Get-Content stitcher/native/VERSION -Raw).Trim()
          if ($actual -ne $expected) {
            throw "Tag $env:RELEASE_VERSION does not match native stitcher version $actual"
          }
      - name: Run native-only policy fixtures
        shell: pwsh
        run: |
          .\release\test-native-only-policy.ps1
          .\release\test-version-policy.ps1
      - name: Build ReShade add-on
        shell: pwsh
        run: |
          cmake -S reshade-addon -B build/reshade-addon -G "Visual Studio 17 2022" -A x64
          cmake --build build/reshade-addon --config Release
      - name: Build release archives
        shell: pwsh
        run: |
          .\release\build-windows-release.ps1 `
            -AddonPath .\build\reshade-addon\Release\PanoramaCaptureReShade.addon64
      - name: Verify archive contents and generate checksums
        shell: pwsh
        run: |
          $version = $env:RELEASE_VERSION.TrimStart("v")
          .\release\audit-windows-stitcher.ps1 `
            -ArchivePath "dist\PanoramaCapture-Stitcher-$version-win-x64.zip" `
            -ReportPath "dist\PanoramaCapture-Stitcher-$version-win-x64.audit.txt" `
            -AllowUnavailable `
            -AuditSourceTree
          $verify = Join-Path $env:RUNNER_TEMP "panorama-release-verify"
          Expand-Archive "dist\PanoramaCapture-Mod-$version.zip" (Join-Path $verify "mod")
          Expand-Archive "dist\PanoramaCapture-Stitcher-$version-win-x64.zip" (Join-Path $verify "stitcher")
          $cet = Join-Path $verify "mod\bin\x64\plugins\cyber_engine_tweaks\mods\PanoramaCaptureProbe\init.lua"
          $addon = Join-Path $verify "mod\bin\x64\PanoramaCaptureReShade.addon64"
          $stitcher = Join-Path $verify "stitcher\PanoramaCaptureStitcher.exe"
          $nativeDll = Join-Path $verify "stitcher\pano_gpu.dll"
          $required = [ordered]@{
            cet = $cet
            reshade_addon = $addon
            stitcher = $stitcher
            d3d12_backend = $nativeDll
          }
          $missing = @($required.GetEnumerator() | Where-Object {
            -not (Test-Path -LiteralPath $_.Value)
          } | ForEach-Object { $_.Key })
          if ($missing.Count -gt 0) {
            Write-Host "Extracted release files:"
            Get-ChildItem $verify -Recurse -File | ForEach-Object {
              Write-Host "  $($_.FullName)"
            }
            throw "Release archive content validation failed; missing: $($missing -join ', ')"
          }
          Get-ChildItem dist -File -Filter "*.zip" | ForEach-Object {
            $hash = (Get-FileHash $_ -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$($_.Name)"
          } | Set-Content dist\SHA256SUMS.txt
      - name: Write build provenance
        shell: pwsh
        run: |
          @(
            "tag=$env:RELEASE_VERSION"
            "commit=$env:GITHUB_SHA"
            "runner_os=$env:RUNNER_OS"
            "runner_image=$env:ImageOS"
            "cmake=$(& cmake --version | Select-Object -First 1)"
            "msbuild=$(& msbuild -version -nologo | Select-Object -First 1)"
          ) | Set-Content dist\BUILD-INFO.txt
      - name: Upload dry-run artifacts
        if: github.event_name == 'workflow_dispatch' && inputs.publish != true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: PanoramaCapture-release-dry-run-${{ env.RELEASE_VERSION }}
          path: |
            dist/*.zip
            dist/*.audit.txt
            dist/SHA256SUMS.txt
            dist/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 7
      - name: Publish GitHub Release assets
        if: github.event_name == 'push' || inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            (Get-ChildItem dist -File -Filter "*.zip").FullName
            (Get-ChildItem dist -File -Filter "*.audit.txt").FullName
            (Resolve-Path dist\SHA256SUMS.txt).Path
            (Resolve-Path dist\BUILD-INFO.txt).Path
          )
          & gh release view $env:RELEASE_VERSION --json tagName | Out-Null
          if ($LASTEXITCODE -eq 0) {
            & gh release upload $env:RELEASE_VERSION $assets --clobber
          } else {
            & gh release create $env:RELEASE_VERSION $assets `
              --verify-tag `
              --generate-notes `
              --title "Panorama Capture $env:RELEASE_VERSION"
          }
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to publish assets for $env:RELEASE_VERSION"
          }
