name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_version:
        description: "Version to package; must match stitcher/pyproject.toml (without v)"
        required: true
        type: string
        default: "0.1.0"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-2022
    env:
      RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.release_version || github.ref_name }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Verify release version
        shell: pwsh
        run: |
          $expected = $env:RELEASE_VERSION.TrimStart("v")
          $actual = (Select-String -Path stitcher/pyproject.toml -Pattern '^version = "(.+)"$').Matches.Groups[1].Value
          if ($actual -ne $expected) {
            throw "Tag $env:RELEASE_VERSION does not match stitcher version $actual"
          }
      - name: Install stitcher and checks
        shell: pwsh
        run: python -m pip install -e ".\stitcher[dev]"
      - name: Run stitcher checks
        shell: pwsh
        run: |
          ruff check stitcher/src stitcher/scripts stitcher/tests reshade-addon/tests
          mypy stitcher/src
          pytest -q stitcher/tests reshade-addon/tests
      - name: Build ReShade add-on
        shell: pwsh
        run: |
          cmake -S reshade-addon -B build/reshade-addon -G "Visual Studio 17 2022" -A x64
          cmake --build build/reshade-addon --config Release
      - name: Build bundled FOV Control
        shell: pwsh
        run: |
          .\release\prepare-fovcontrol.ps1 -Source .\vendor\FovControl -Destination .\build\fovcontrol-source
          cmake -S build/fovcontrol-source -B build/fovcontrol -G "Visual Studio 17 2022" -A x64
          cmake --build build/fovcontrol --config Release
      - name: Build release archives
        shell: pwsh
        run: |
          $version = $env:RELEASE_VERSION.TrimStart("v")
          .\release\build-windows-release.ps1 `
            -AddonPath .\build\reshade-addon\Release\PanoramaCaptureReShade.addon64 `
            -Version $version `
            -FovControlRoot .\build\fovcontrol-source `
            -PythonCommand python
      - name: Verify archive contents and generate checksums
        shell: pwsh
        run: |
          $version = $env:RELEASE_VERSION.TrimStart("v")
          $verify = Join-Path $env:RUNNER_TEMP "panorama-release-verify"
          Expand-Archive "dist\PanoramaCapture-Mod-$version.zip" (Join-Path $verify "mod")
          Expand-Archive "dist\PanoramaCapture-Stitcher-$version-win-x64.zip" (Join-Path $verify "stitcher")
          $cet = Join-Path $verify "mod\bin\x64\plugins\cyber_engine_tweaks\mods\PanoramaCaptureProbe\init.lua"
          $addon = Join-Path $verify "mod\bin\x64\PanoramaCaptureReShade.addon64"
          $fovDll = Join-Path $verify "mod\red4ext\plugins\PanoramaFovControl\PanoramaFovControl.dll"
          $fovScript = Join-Path $verify "mod\r6\scripts\PanoramaFovControl\PanoramaFovControl.reds"
          $stitcher = Join-Path $verify "stitcher\PanoramaCaptureStitcher\PanoramaCaptureStitcher.exe"
          $required = [ordered]@{
            cet = $cet
            reshade_addon = $addon
            fov_dll = $fovDll
            fov_redscript = $fovScript
            stitcher = $stitcher
          }
          $missing = @($required.GetEnumerator() | Where-Object {
            -not (Test-Path -LiteralPath $_.Value)
          } | ForEach-Object { $_.Key })
          if ($missing.Count -gt 0) {
            Write-Host "Extracted release files:"
            Get-ChildItem $verify -Recurse -File | ForEach-Object {
              Write-Host "  $($_.FullName)"
            }
            throw "Release archive content validation failed; missing: $($missing -join ', ')"
          }
          Get-ChildItem dist -File -Filter "*.zip" | ForEach-Object {
            $hash = (Get-FileHash $_ -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$($_.Name)"
          } | Set-Content dist\SHA256SUMS.txt
      - name: Write build provenance
        shell: pwsh
        run: |
          @(
            "tag=$env:RELEASE_VERSION"
            "commit=$env:GITHUB_SHA"
            "runner_os=$env:RUNNER_OS"
            "runner_image=$env:ImageOS"
            ""
            "pip_freeze:"
          ) | Set-Content dist\BUILD-INFO.txt
          & .\.venv-release\Scripts\python.exe -m pip freeze | Add-Content dist\BUILD-INFO.txt
      - name: Upload dry-run artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: PanoramaCapture-release-dry-run-${{ env.RELEASE_VERSION }}
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 7
      - name: Publish GitHub Release assets
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            (Get-ChildItem dist -File -Filter "*.zip").FullName
            (Resolve-Path dist\SHA256SUMS.txt).Path
            (Resolve-Path dist\BUILD-INFO.txt).Path
          )
          & gh release create $env:RELEASE_VERSION $assets `
            --verify-tag `
            --generate-notes `
            --title "Panorama Capture $env:RELEASE_VERSION"
