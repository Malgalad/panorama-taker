name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  stitcher:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Check Lua formatting
        uses: JohnnyMorganz/stylua-action@76fd70c03e6340ceaf673366712db9b20560b402 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v2.5.2
          args: --check mod/cet/PanoramaCaptureProbe/init.lua
      - name: Configure native stitcher
        run: cmake -S stitcher/native -B build/stitcher-native -DCMAKE_BUILD_TYPE=Release
      - name: Build native stitcher
        run: cmake --build build/stitcher-native --config Release --parallel 2
      - name: Run native contracts
        run: |
          ctest --test-dir build/stitcher-native -C Release --output-on-failure
