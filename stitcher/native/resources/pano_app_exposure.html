<!doctype html>
<html lang="en" class="exposure-page">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
  <title>Exposure</title>
  <link rel="stylesheet" href="pano_app_ui.css">
</head>
<body>
  <main class="exposure-root flex w-75 flex-col gap-4 bg-gray-950 p-4 text-gray-300">
    <label class="flex items-center gap-4"><input id="show-overlay" class="input-checkbox" type="checkbox">Show overlay</label>
    <hr class="border-gray-500">
    <div class="flex items-center gap-3">Reference pose: <span id="reference" class="text-cyan-300">&lt;none&gt;</span></div>
    <div id="poses" class="flex flex-wrap gap-2 rounded-md border border-gray-500 p-2"></div>
    <div class="text-gray-400 italic">Select pose with reference exposure and equalize every other pose with it, or limit adjustment to manually selected poses.<br>LMB for reference, RMB for manual selection.</div>
    <div class="flex justify-end gap-4">
      <button id="reset" class="button" type="button">Reset</button>
      <button id="equalize" class="button primary" type="button">Equalize all</button>
    </div>
  </main>
  <script src="pano_app_exposure.js"></script>
</body>
</html>
