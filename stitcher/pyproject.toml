[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pano-stitch"
version = "1.0.1"
description = "Metadata-driven Cyberpunk 2077 panorama stitching tools"
requires-python = ">=3.12"
dependencies = [
  "jsonschema>=4.20",
  "numpy>=2.0",
  "opencv-python>=4.10",
  "pillow>=10.0",
  "OpenEXR>=3.4"
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8",
  "ruff>=0.6",
  "types-jsonschema>=4.24"
]
gpu = [
  "cupy-cuda12x>=14,<15",
  "nvidia-cuda-runtime-cu12>=12,<13",
  "nvidia-cuda-nvrtc-cu12>=12,<13"
]
bundle = [
  "pyinstaller>=6.10"
]

[project.scripts]
pano-stitch = "pano_stitch.cli:main"
pano-stitch-gui = "pano_stitch.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
